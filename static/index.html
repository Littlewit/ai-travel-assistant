<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>智能 AI 旅游助手</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <!-- 引入 marked.js (使用 CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 全局重置与移动端基础样式 */
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; /* 防止背景滚动 */
            -webkit-tap-highlight-color: transparent; /* 消除移动端点击高亮 */
            overscroll-behavior: contain; /* 防止页面下拉刷新 */
        }
        .chat-container { 
            width: 90%; /* 宽度占屏幕 90% */
            max-width: 1000px; /* 最大宽度限制，防止在大屏上太宽 */
            height: 100vh; /* 高度占屏幕 100% */
            background: white; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.12); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .chat-header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 20px; 
            letter-spacing: 1px; 
            flex-shrink: 0; /* 头部不压缩 */
        }
        .chat-messages { 
            flex: 1; /* 占据剩余所有空间 */
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #fafafa; 
        }
        .message { 
            max-width: 85%; 
            padding: 12px 18px; 
            border-radius: 18px; 
            font-size: 16px; 
            line-height: 1.6; 
            word-wrap: break-word; 
        }
        .user-message { 
            align-self: flex-end; 
            background: #667eea; 
            color: white; 
            border-bottom-right-radius: 4px; 
            box-shadow: 0 2px 5px rgba(102, 126, 234, 0.3); 
        }
        .ai-message { 
            align-self: flex-start; 
            background: white; 
            color: #333; 
            border: 1px solid #e0e0e0; 
            border-bottom-left-radius: 4px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        /* Markdown 样式微调 */
        .ai-message p { margin: 0 0 10px 0; }
        .ai-message p:last-child { margin-bottom: 0; }
        .ai-message ul, .ai-message ol { margin: 0 0 10px 0; padding-left: 20px; }
        /* Markdown 内容溢出防护（移动端关键） */
        .ai-message pre {
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 100%;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
        }
        .ai-message code {
            word-break: break-all;
            font-size: 0.9em;
        }
        .ai-message img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .ai-message table {
            display: block;
            overflow-x: auto;
            max-width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .ai-message table th,
        .ai-message table td {
            padding: 6px 10px;
            border: 1px solid #ddd;
            white-space: nowrap;
        }
        /* 欢迎消息与提示示例样式 */
        .welcome-message {
            max-width: 100% !important;
            background: linear-gradient(135deg, #f0f4ff 0%, #fff5f5 100%);
            border: 1px solid #e8e0f0;
            border-radius: 18px;
            padding: 18px 20px;
        }
        .welcome-message p {
            margin: 0 0 10px 0;
            font-size: 15px;
            line-height: 1.7;
            color: #444;
        }
        .welcome-message p:last-of-type {
            margin-bottom: 12px;
        }
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip {
            display: inline-block;
            padding: 8px 14px;
            background: white;
            border: 1px solid #d0c8e0;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .chip:active {
            transform: translateY(0);
        }
        /* 移动端点击反馈 */
        @media (hover: none) {
            .chip:active {
                background: #667eea;
                color: white;
                border-color: #667eea;
                transform: scale(0.96);
            }
        }
        .input-area { 
            padding: 20px; 
            border-top: 1px solid #eee; 
            display: flex; 
            gap: 12px; 
            background: white; 
            flex-shrink: 0; /* 输入框不压缩 */
        }
        input { 
            flex: 1; 
            padding: 15px 20px; 
            border: 1px solid #ddd; 
            border-radius: 25px; 
            outline: none; 
            transition: border-color 0.3s; 
            font-size: 16px;
        }
        input:focus { border-color: #667eea; }
        button { 
            padding: 15px 30px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: 600; 
            font-size: 16px;
        }
        button:hover { background: #5a6fd6; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        /* ========== 响应式设计 - 平板 & 大屏手机 (≤768px) ========== */
        @media (max-width: 768px) {
            .chat-header {
                padding: 15px;
                font-size: 18px;
            }
            .chat-messages {
                padding: 15px;
                gap: 12px;
            }
            .message {
                max-width: 90%;
                padding: 10px 14px;
                font-size: 15px;
            }
            .input-area {
                padding: 15px;
            }
        }

        /* ========== 响应式设计 - 小屏手机 (≤480px) ========== */
        @media (max-width: 480px) {
            .chat-container {
                width: 100%;
                max-width: 100%;
                height: 100dvh; /* 动态视口高度，解决移动端地址栏伸缩问题 */
                border-radius: 0;
                box-shadow: none;
            }
            .chat-header {
                padding: 12px 12px;
                padding-top: calc(12px + var(--safe-area-top));
                font-size: 16px;
            }
            .chat-messages {
                padding: 10px;
                gap: 10px;
                -webkit-overflow-scrolling: touch; /* iOS 顺滑滚动 */
            }
            .message {
                max-width: 92%;
                padding: 8px 12px;
                font-size: 14px;
            }
            .input-area {
                padding: 10px;
                padding-bottom: calc(10px + var(--safe-area-bottom));
                gap: 8px;
            }
            input {
                padding: 12px 16px;
                font-size: 16px; /* 保持 16px 防止 iOS 自动缩放 */
            }
            button {
                padding: 12px 20px;
                font-size: 15px;
                min-height: 44px; /* 触控最小高度 */
                min-width: 70px;
            }
        }

        /* ========== 响应式设计 - 横屏手机 ========== */
        @media (orientation: landscape) and (max-height: 500px) {
            .chat-header {
                padding: 8px;
                font-size: 15px;
            }
            .chat-messages {
                padding: 8px;
                gap: 8px;
            }
            .input-area {
                padding: 8px;
                gap: 6px;
            }
            button {
                padding: 10px 16px;
                font-size: 14px;
                min-height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🌍 智能 AI 旅游助手</div>
        <div class="chat-messages" id="messages">
            <div class="message ai-message welcome-message">
                <p>👋 你好！我是你的<a href="#" onclick="event.preventDefault()" style="color:inherit;text-decoration:none;">智能 AI 旅游助手</a>。</p>
                <p>我可以帮你规划行程、推荐景点美食、提供交通建议。试试点击下面的问题快速开始：</p>
                <div class="suggestion-chips" id="suggestionChips">
                    <span class="chip" onclick="useSuggestion('北京三日游怎么安排？')">北京三日游</span>
                    <span class="chip" onclick="useSuggestion('成都大熊猫基地怎么去？几点去最好？')">🐼 成都熊猫基地</span>
                    <span class="chip" onclick="useSuggestion('上海外滩夜景什么时间看最好？')">🌃 上海外滩夜景</span>
                    <span class="chip" onclick="useSuggestion('去大理洱海骑行有什么路线推荐？')">🚴 大理洱海骑行</span>
                    <span class="chip" onclick="useSuggestion('北京烤鸭哪家最正宗？')">🦆 北京烤鸭推荐</span>
                    <span class="chip" onclick="useSuggestion('成都火锅哪家好吃？')">🌶️ 成都火锅指南</span>
                    <span class="chip" onclick="useSuggestion('上海有哪些必吃的小吃？')">🥟 上海小吃推荐</span>
                    <span class="chip" onclick="useSuggestion('第一次去北京旅游需要注意什么？')">📋 北京旅游攻略</span>
                    <span class="chip" onclick="useSuggestion('我想去云南大理，给我推荐一个三天行程')">🗺️ 大理三日游</span>
                    <span class="chip" onclick="useSuggestion('长沙三天两晚有什么推荐？')">🏙️ 长沙三天两晚</span>
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入您的旅游需求..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // 生成或从本地存储获取 session_id
        let sessionId = localStorage.getItem('travel_assistant_session_id');
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem('travel_assistant_session_id', sessionId);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user-message', false);
            input.value = '';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.textContent = "🤖 正在为您规划行程..."; 
            document.getElementById('messages').appendChild(aiDiv);
            scrollToBottom();

            let fullContent = "";

            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, session_id: sessionId })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.session_id) {
                                    sessionId = data.session_id;
                                    localStorage.setItem('travel_assistant_session_id', sessionId);
                                    continue;
                                }

                                const token = data.content;
                                if (token) {
                                    fullContent += token;
                                    // 【关键修改】：每次收到新内容都重新渲染 Markdown
                                    // marked.parse 现在非常高效，可以支持实时渲染
                                    aiDiv.innerHTML = marked.parse(fullContent);
                                    scrollToBottom();
                                }
                            } catch (e) {
                                console.error("解析错误:", e, line);
                            }
                        }
                    }
                }
                
                // 确保最后一次渲染是完整的
                aiDiv.innerHTML = marked.parse(fullContent);
                scrollToBottom();

            } catch (error) {
                aiDiv.textContent = "抱歉，网络连接出现了一点问题。";
            }
        }

        function addMessage(text, className, isMarkdown = true) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerHTML = isMarkdown ? marked.parse(text) : text;
            document.getElementById('messages').appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        /** 点击提示示例，自动填入并发送 */
        function useSuggestion(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }
    </script>
</body>
</html>
